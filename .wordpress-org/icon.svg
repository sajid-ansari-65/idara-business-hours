<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Idara Business Hours">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12897f"/>
      <stop offset="1" stop-color="#0b544d"/>
    </linearGradient>
    <linearGradient id="hand" x1="128" y1="60" x2="128" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square base -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- Subtle 8-point star watermark (Idara motif) -->
  <g opacity="0.10" fill="#ccfbf1">
    <path d="M128 26 L142 92 L204 66 L164 120 L226 128 L164 136 L204 190 L142 164 L128 230 L114 164 L52 190 L92 136 L30 128 L92 120 L52 66 L114 92 Z"/>
  </g>

  <!-- Clock dial ring -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="#ccfbf1" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Cardinal ticks -->
  <g stroke="#ccfbf1" stroke-width="7" stroke-linecap="round">
    <line x1="128" y1="66"  x2="128" y2="80"/>
    <line x1="128" y1="176" x2="128" y2="190"/>
    <line x1="66"  y1="128" x2="80"  y2="128"/>
    <line x1="176" y1="128" x2="190" y2="128"/>
  </g>

  <!-- Hands at ~10:10 (classic open, friendly) -->
  <g stroke="url(#hand)" stroke-linecap="round">
    <line x1="128" y1="128" x2="96"  y2="98"  stroke-width="11"/>
    <line x1="128" y1="128" x2="160" y2="92"  stroke-width="9"/>
  </g>

  <!-- Center hub: tiny 8-point star -->
  <path d="M128 112 L132 124 L144 120 L136 130 L148 128 L136 132 L144 140 L132 134 L128 146 L124 134 L112 140 L120 132 L108 128 L120 130 L112 120 L124 124 Z" fill="#fef3c7"/>
</svg>
